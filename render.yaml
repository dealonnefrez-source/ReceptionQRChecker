services:
  - type: web
    name: receptionqr-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RECEPTIONQR_DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.10
